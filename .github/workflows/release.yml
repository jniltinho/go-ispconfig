name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Install Go Dependencies
        run: make deps

      # Test gate: a tag never ships from a broken tree.
      - name: Lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.12.2
          args: --build-tags integration ./...

      - name: Go Tests
        run: go test ./internal/...

      - name: Frontend Tests
        run: cd frontend && npm test

      - name: Install Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y upx-ucl rpm

      # build-prod runs once for both targets, so bin/ holds the same
      # UPX-compressed binary the packages ship.
      - name: Build Packages
        run: make deb rpm

      - name: Package Binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE_NAME="go-ispconfig_${VERSION}_linux_amd64.tar.gz"
          cd bin && tar -czvf "../$ARCHIVE_NAME" go-ispconfig && cd ..
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            go-ispconfig_*.deb
            go-ispconfig-*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
