# Managed by go-ispconfig — local changes belong in
# conf.d/99-local.conf, this file is rewritten on every install run.
#
# Dovecot 2.3 dialect (Ubuntu 24.04, Debian 12). The 2.4 rewrite lives in
# dovecot-2.4.conf; the installer picks by `dovecot --version`.
#
# conf.d/*.conf is deliberately NOT included: the distribution defaults
# there configure mbox in ~/mail, which would silently shadow the virtual
# maildirs below (this is what ISPConfig 3 does too).

listen = *,[::]
protocols = imap pop3 lmtp sieve
auth_mechanisms = plain login
disable_plaintext_auth = no
log_timestamp = "%Y-%m-%d %H:%M:%S "
postmaster_address = postmaster@{hostname}

mail_privileged_group = {mailuser_group}
mail_location = maildir:{homedir}/%d/%n/Maildir
mail_home = {homedir}/%d/%n
mail_max_userip_connections = 100
mail_plugins = quota

ssl = yes
ssl_cert = <{ssl_cert}
ssl_key = <{ssl_key}
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no

namespace inbox {
  inbox = yes
}

passdb {
  driver = sql
  args = {sql_conf}
}
# The password_query already returns every userdb_ field, so the common
# case needs no second round-trip; the sql userdb below is the fallback
# for lookups that do not go through a login (LMTP, doveadm).
userdb {
  driver = prefetch
}
userdb {
  driver = sql
  args = {sql_conf}
}

plugin {
  quota = dict:user::file:{homedir}/%d/%n/.quotausage
  sieve = {homedir}/%d/%n/.sieve
  sieve_before = {homedir}/%d/%n/.ispconfig-before.sieve
  sieve_after = {homedir}/%d/%n/.ispconfig.sieve
  sieve_max_script_size = 2M
  sieve_max_actions = 100
  sieve_max_redirects = 25
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}

service auth {
  # Postfix authenticates its submission clients against Dovecot through
  # this socket (smtpd_sasl_type = dovecot).
  unix_listener /var/spool/postfix/private/auth {
    group = postfix
    mode = 0660
    user = postfix
  }
  unix_listener auth-userdb {
    group = {mailuser_group}
    mode = 0600
    user = {mailuser_name}
  }
  user = root
}

service lmtp {
  # Postfix's virtual_transport delivers into this socket.
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}

service imap-login {
  client_limit = 1000
  process_limit = 512
}

service stats {
  unix_listener stats-reader {
    group = {mailuser_group}
    mode = 0660
    user = {mailuser_name}
  }
  unix_listener stats-writer {
    group = {mailuser_group}
    mode = 0660
    user = {mailuser_name}
  }
}

service quota-status {
  executable = quota-status -p postfix
  unix_listener /var/spool/postfix/private/quota-status {
    group = postfix
    mode = 0660
    user = postfix
  }
  client_limit = 1
}

lmtp_rcpt_check_quota = yes

protocol imap {
  mail_plugins = $mail_plugins quota imap_quota
  auth_verbose = yes
}

protocol pop3 {
  pop3_uidl_format = %08Xu%08Xv
  mail_plugins = $mail_plugins quota
  auth_verbose = yes
}

protocol lda {
  postmaster_address = postmaster@{hostname}
  mail_plugins = $mail_plugins sieve quota
}

protocol lmtp {
  postmaster_address = postmaster@{hostname}
  mail_plugins = $mail_plugins quota sieve
}

!include_try conf.d/99-local.conf
