# Managed by go-ispconfig — Dovecot 2.4 SQL auth (mode 0600, holds the
# panel database password). Included from dovecot.conf.
#
# Same lookups as the 2.3 file, translated to the 2.4 syntax: the
# connection is its own `mysql <host> {}` block, passdb/userdb take the
# query inline, and %u/%d/%Ls became %{user}/%{user|domain}/%{protocol}.
mysql {mysql_server_ip} {
  port = {mysql_server_port}
  user = {mysql_server_ispconfig_user}
  password = {mysql_server_ispconfig_password}
  dbname = {mysql_server_database}
}

passdb sql {
  sql_driver = mysql
  default_password_scheme = CRYPT
  query = SELECT email AS user, password, maildir AS userdb_home, uid AS userdb_uid, gid AS userdb_gid, quota AS userdb_quota_storage_size, CONCAT(maildir, '/.sieve') AS userdb_sieve_script_personal_path, NULLIF(imap_prefix, '') AS "userdb_namespace/inbox/prefix" FROM mail_user WHERE (login = '%{user}' OR email = '%{user}') AND `disable%{protocol}` = 'n' AND server_id = '{server_id}' AND NOT EXISTS (SELECT domain_id FROM mail_domain WHERE domain = '%{user | domain}' AND active = 'n' AND server_id = {server_id})
}

# The passdb above already returns every userdb_ field, so a login needs no
# second round-trip; the sql userdb is the fallback for lookups that do not
# go through one (LMTP delivery, doveadm).
userdb prefetch {
}

userdb sql {
  sql_driver = mysql
  query = SELECT email AS user, maildir AS home, uid, gid, quota AS quota_storage_size, CONCAT(maildir, '/.sieve') AS sieve_script_personal_path, NULLIF(imap_prefix, '') AS "namespace/inbox/prefix" FROM mail_user WHERE (login = '%{user}' OR email = '%{user}') AND `disable%{protocol}` = 'n' AND server_id = '{server_id}'
  iterate_query = SELECT email AS user FROM mail_user WHERE disabledoveadm = 'n' AND server_id = '{server_id}'
}
