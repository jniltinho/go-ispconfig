# Managed by go-ispconfig — local changes belong in
# conf.d/99-local.conf, this file is rewritten on every install run.
#
# Dovecot 2.4 dialect (Debian 13+). 2.4 renamed most of the settings the
# 2.3 file uses (mail_location -> mail_driver/mail_path, the %u/%d/%n
# variables -> %{user...}, plugin{} -> named filters), so the two configs
# cannot be shared; the installer picks by `dovecot --version`.
#
# conf.d/*.conf is deliberately NOT included: the distribution defaults
# there configure mbox in ~/mail, which would silently shadow the virtual
# maildirs below.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

listen = *,[::]
protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}
auth_mechanisms = plain login
auth_allow_cleartext = yes
postmaster_address = postmaster@{hostname}

mail_privileged_group = {mailuser_group}
mail_driver = maildir
mail_home = {homedir}/%{user | domain}/%{user | username}
mail_path = %{home}/Maildir
mail_max_userip_connections = 100

ssl = yes
ssl_server_cert_file = {ssl_cert}
ssl_server_key_file = {ssl_key}
ssl_min_protocol = TLSv1.2

namespace inbox {
  inbox = yes
}

# Holds the database password, hence a separate 0600 file.
!include {sql_conf}

mail_plugins {
  quota = yes
}

# 2.4 has no quota_rule userdb field any more: the limit is a named quota
# root whose storage_size the userdb overrides per mailbox (0 = unlimited,
# which is what the panel stores for "no quota").
quota User {
  storage_size = 0
}

quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = "552 5.2.2 Mailbox is full"

sieve_script personal {
  driver = file
  path = %{home}/.sieve
}
sieve_script after {
  driver = file
  path = %{home}/.ispconfig.sieve
}
sieve_script before {
  driver = file
  path = %{home}/.ispconfig-before.sieve
}
sieve_max_script_size = 2M
sieve_max_actions = 100
sieve_max_redirects = 25

service auth {
  # Postfix authenticates its submission clients against Dovecot through
  # this socket (smtpd_sasl_type = dovecot).
  unix_listener /var/spool/postfix/private/auth {
    group = postfix
    mode = 0660
    user = postfix
  }
  unix_listener auth-userdb {
    group = {mailuser_group}
    mode = 0600
    user = {mailuser_name}
  }
  user = root
}

service lmtp {
  # Postfix's virtual_transport delivers into this socket.
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}

service imap-login {
  client_limit = 1000
  process_limit = 512
}

service stats {
  unix_listener stats-reader {
    group = {mailuser_group}
    mode = 0660
    user = {mailuser_name}
  }
  unix_listener stats-writer {
    group = {mailuser_group}
    mode = 0660
    user = {mailuser_name}
  }
}

service quota-status {
  executable = quota-status -p postfix
  unix_listener /var/spool/postfix/private/quota-status {
    group = postfix
    mode = 0660
    user = postfix
  }
  client_limit = 1
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

protocol pop3 {
  # Same UIDLs as the 2.3 "%08Xu%08Xv": a host upgraded from Debian 12 to
  # 13 must not make every POP3 client re-download the whole mailbox.
  pop3_uidl_format = %{uid | hex(8)}%{uidvalidity | hex(8)}
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  auth_username_format = %{user | lower}
}

protocol lda {
  mail_plugins {
    sieve = yes
  }
}

!include_try conf.d/99-local.conf
