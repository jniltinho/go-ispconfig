    <link rel="apple-touch-icon" href="/icon-isp-panel-256.png" />
    <meta name="theme-color" content="#c70f19" />
    <!-- Dark-mode bootstrap BEFORE first paint: no flash of the wrong
         scheme. Mirror of src/theme.ts prefersDark() — keep in sync. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* restricted storage: stay on the light scheme */
        }
      })()
    </script>
